interface:
  display_name: "GitHub Review Triage"
  short_description: "Triage GitHub PR review URLs with minimal-context subagents"
  default_prompt: "Use $github-review-triage to launch one capable intake subagent, allow it to analyze one bounded concern, and route larger surfaces to separate cluster-scoped analysis subagents while the parent aggregates results. Keep the same reasoning-heavy capability floor for intake and analysis. Prepare replies only when requested, label drafts for unfinalized skip decisions provisional with unresolved assumptions, and do not post them without explicit authorization."
